[workspace]
name = "mojo-dllm"
version = "0.1.0"
description = "Portable local inference for diffusion language models, written in Mojo."
authors = ["Vladimir Rotariu <rotariuvladimir@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = "==1.1.0"
max-core = "==26.6.0"

[tasks]
mkbuild = "mkdir -p build"
# -Werror keeps deprecations from piling up between Mojo releases: a warning
# today is a removed API in the next stable.
# scripts/build.sh names the GPU architecture, so machines without a GPU can build.
build = { cmd = "MOJO=mojo bash scripts/build.sh", depends-on = ["mkbuild"] }
test = "bash scripts/run-tests.sh"
fmt = "mojo format -q src tests bench"
# `mojo format` has no check mode: format in place, then require a clean diff.
fmt-check = "mojo format -q src tests bench && git diff --exit-code -- src tests bench"
check = { depends-on = ["fmt-check", "build", "test"] }
