---
version: 2
updates:
  # Workflow actions are the only dependency Dependabot can see here: Mojo and
  # max-core are pinned in pixi.toml on purpose and moved by hand, because a
  # Mojo release can change the language (1.1 removed `fn`).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # Hold version bumps until a release has had time to be vetted; security
    # updates are not subject to cooldown.
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
