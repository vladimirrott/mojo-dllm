---
name: CI

# The same gates scripts/ci-local.sh runs, split into three parallel jobs.
# Run them locally first (`scripts/ci-local.sh`, or the pre-push hook), so a
# push reaches CI already green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.9.7"
          enable-cache: true

      - name: Launcher tests
        run: uv run --frozen --only-group test pytest tests/python -q

      - name: Install markdownlint at its exact version
        run: npm install --global markdownlint-cli2@0.23.2

      - name: Secrets and employer name in tracked files
        # Report every gate, not just the first failure.
        if: ${{ !cancelled() }}
        run: bash scripts/check_hygiene.sh --tracked

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: shellcheck --severity=warning scripts/*.sh .githooks/*

      - name: yamllint
        if: ${{ !cancelled() }}
        run: uv run --frozen --only-group lint yamllint --strict .github

      - name: markdownlint
        if: ${{ !cancelled() }}
        run: markdownlint-cli2 "*.md" "docs/**/*.md" "#docs/spec.md"

      - name: README benchmark numbers come from bench/results
        if: ${{ !cancelled() }}
        run: uv run --no-project python scripts/bench_table.py --check

      - name: GSM8K eval harness self-test
        if: ${{ !cancelled() }}
        run: uv run --no-project python bench/eval_gsm8k.py --self-test

      - name: check_weights self-test
        if: ${{ !cancelled() }}
        # A regression in the FIFO guard hangs instead of failing.
        timeout-minutes: 5
        run: uv run --frozen --only-group fixtures python scripts/check_weights.py --self-test

      - name: Action pins match the tags in their comments
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-action-pins.sh

  mojo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.9.7"
          enable-cache: true

      - name: Install the pinned Mojo toolchain
        run: uv sync --frozen

      - name: mojo format (no check mode, so format and diff)
        run: uv run --frozen mojo format -q src tests bench && git diff --exit-code -- src tests bench

      - name: Build with -Werror
        run: bash scripts/build.sh

      - name: Tests, with the passing count pinned
        run: bash scripts/run-tests.sh

      # The runner has no GPU. scripts/build.sh then compiles the kernels for
      # sm_80; the GPU suite runs locally through scripts/run-gpu-tests.sh.
      # Here it must still build, and --device gpu must fail with a message
      # rather than a crash.
      - name: GPU test suite builds
        run: bash scripts/build.sh tests/gpu/test_gpu.mojo build/tests/test_gpu

      - name: --device gpu without a GPU fails cleanly
        run: bash scripts/check_no_gpu.sh

      - name: --visual-interval errors before model loading
        run: bash scripts/check_visual.sh

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install mdBook (checksum verified)
        env:
          MDBOOK_VERSION: "0.4.40"
          MDBOOK_SHA256: "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b"
        run: |
          set -euo pipefail
          curl -sSfL -o mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum --check --strict -
          tar -xzf mdbook.tar.gz --directory /usr/local/bin

      - name: Build the book and check relative links
        run: |
          mdbook build
          python3 scripts/check_links.py
