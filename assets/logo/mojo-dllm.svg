<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t d">
  <title id="t">mojo-dllm</title>
  <desc id="d">A 5 by 5 canvas of tokens. Teal dashed squares are still masked; ember squares are resolved, and together they form a flame: a diffusion model denoising its canvas, written in Mojo.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB45A"/>
      <stop offset="1" stop-color="#FF6B1A"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3B0"/>
      <stop offset="1" stop-color="#FFB45A"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#0F1419" filter="url(#shadow)"/>
  <g transform="translate(43 43)">
    <!-- masked cells: teal, dashed -->
    <g fill="none" stroke="#5EEAD4" stroke-width="3" stroke-dasharray="6 5" opacity="0.75">
      <rect x="2" y="2" width="30" height="30" rx="7"/>
      <rect x="36" y="2" width="30" height="30" rx="7"/>
      <rect x="104" y="2" width="30" height="30" rx="7"/>
      <rect x="138" y="2" width="30" height="30" rx="7"/>
      <rect x="2" y="36" width="30" height="30" rx="7"/>
      <rect x="104" y="36" width="30" height="30" rx="7"/>
      <rect x="138" y="36" width="30" height="30" rx="7"/>
      <rect x="2" y="70" width="30" height="30" rx="7"/>
      <rect x="138" y="70" width="30" height="30" rx="7"/>
      <rect x="2" y="138" width="30" height="30" rx="7"/>
      <rect x="138" y="138" width="30" height="30" rx="7"/>
    </g>
    <!-- resolved cells: ember, forming a flame -->
    <g fill="url(#ember)">
      <rect x="70" y="2" width="30" height="30" rx="7"/>
      <rect x="36" y="36" width="30" height="30" rx="7"/>
      <rect x="70" y="36" width="30" height="30" rx="7"/>
      <rect x="36" y="70" width="30" height="30" rx="7"/>
      <rect x="104" y="70" width="30" height="30" rx="7"/>
      <rect x="2" y="104" width="30" height="30" rx="7"/>
      <rect x="36" y="104" width="30" height="30" rx="7"/>
      <rect x="104" y="104" width="30" height="30" rx="7"/>
      <rect x="138" y="104" width="30" height="30" rx="7"/>
      <rect x="36" y="138" width="30" height="30" rx="7"/>
      <rect x="104" y="138" width="30" height="30" rx="7"/>
    </g>
    <!-- the hottest tokens: the flame's core -->
    <g fill="url(#core)">
      <rect x="70" y="70" width="30" height="30" rx="7"/>
      <rect x="70" y="104" width="30" height="30" rx="7"/>
      <rect x="70" y="138" width="30" height="30" rx="7"/>
    </g>
  </g>
</svg>
